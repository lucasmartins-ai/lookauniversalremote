name: LookARemote CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust-host-daemon:
    name: Rust Host Daemon & Protocol
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check Rust Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy Lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Rust Integration Tests
        run: cargo test --workspace -- --test-threads=2

  web-client:
    name: Web Client PWA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck Web Client
        run: cd apps/web-client && npm run build

      - name: Run Web Client Unit Tests
        run: cd apps/web-client && npm test

      - name: Verify Production PWA Dist Artifacts
        run: |
          test -f apps/web-client/dist/manifest.webmanifest || (echo "manifest missing" && exit 1)
          test -f apps/web-client/dist/sw.js || (echo "sw.js missing" && exit 1)
          test -f apps/web-client/dist/index.html || (echo "index.html missing" && exit 1)
