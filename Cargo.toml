[workspace]
members = [
    "packages/protocol",
    "apps/host-daemon",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["LookARemote Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/lookaremote/lookaremote"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1
debug = true
